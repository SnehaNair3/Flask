<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask</title>
</head>
<body>
    <h1> Hello</h1>
    <p>{{ mylist }}</p>
    <ul>
        {% for item in mylist %}
           {% if item == 30 %}
              <li style="color:red">{{ item }}</li>
           {% else %}
              <li>{{ item }}</li>
           {% endif %}      
        {% endfor %}
    </ul>

    <ul>
        {% for item in mylist %}
            <li {% if item == 50 %}style="color:purple" {% endif %}>{{item }}</li>
        {% endfor %}
    </ul>
</body>
</html>
